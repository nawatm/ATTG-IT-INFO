services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: attg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: attg_info
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - attg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attg -d attg_info"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  attg_data:
